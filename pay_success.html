<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Confirmed — Consiere</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Georgia',serif;background:#f4f0eb;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{background:#fff;border-radius:16px;padding:48px 40px;max-width:480px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
  .icon{font-size:56px;margin-bottom:24px}
  h1{font-size:28px;font-weight:400;color:#1a1612;margin-bottom:12px}
  p{font-size:15px;color:#78716c;line-height:1.7;margin-bottom:8px}
  .highlight{color:#c9a96e;font-weight:600}
  .wa{margin-top:32px;padding:16px;background:#25D36610;border-radius:10px;font-size:13px;color:#128C7E}
  .btn{display:inline-block;margin-top:28px;padding:14px 32px;background:#1a1612;color:#fff;text-decoration:none;border-radius:8px;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Payment confirmed!</h1>
  <p>Thank you. Your payment has been received.</p>
  <p class="highlight">Alina is now coordinating your request.</p>
  <div class="wa">
    📱 You'll receive a confirmation and updates directly on <strong>WhatsApp</strong>. No need to log in.
  </div>
  <a href="https://consiere.com.au" class="btn">Back to Consiere</a>
</div>
</body>
</html>
